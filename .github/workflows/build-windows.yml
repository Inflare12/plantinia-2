name: Build Plantinia Offline
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline import smoke test
        run: python -m unittest discover -s tests -v
      - name: Build UI smoke executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -AllowMissingModels
      - name: Upload executable bundle
        uses: actions/upload-artifact@v4
        with:
          name: PlantiniaOffline-Windows-Smoke
          path: dist/PlantiniaOffline/
